server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # Proxy Reverso: tudo que comeca com /api vai para a API
    # O nome do host 'api' corresponde ao nome do servico no docker-compose.yml
    # ============================================================
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP $remote_addr;

        # Timeouts generosos para upload de PDF
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    300s;
        client_max_body_size  10M;
    }

    # ============================================================
    # Health check simples do Nginx
    # ============================================================
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ============================================================
    # Cache agressivo para assets imutaveis do Vite (hashed)
    # ============================================================
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ============================================================
    # Fallback para SPA (React Router): qualquer rota cai no index.html
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seguranca: oculta versao do Nginx nos headers
    server_tokens off;
}
